name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies (Clean Install)
        run: npm ci

      - name: Check JavaScript Syntax (All Files)
        run: |
          find . -name "*.js" -not -path "*/node_modules/*" -exec node --check {} +
          echo "All JS files passed syntax check!"